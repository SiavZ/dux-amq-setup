[workspace]
members = [
    "crates/dux-core",
    "crates/dux-tui",
    "crates/dux",
    "crates/dux-web",
]
resolver = "3"

# Single source of truth for the crate version so the TUI (dux-tui) and the web
# (dux-core's display_version) can never show different versions.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
rustix = { version = "1.1", features = ["termios", "process", "event", "stdio", "fs", "time"] }
dux-core = { path = "crates/dux-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
indexmap = { version = "2.13.0", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4"] }
home = "0.5.11"
content_inspector = "0.2.4"
tempfile = "3.20.0"
notify = "7"
flate2 = "1"
# Structured logging: `tracing` macros write JSON Lines into dux.log through
# dux-core's own rotating writer (logger::JsonLinesLayer), so only the
# registry is needed from tracing-subscriber, not its fmt/json/env-filter.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
# 0.36 is a floor, not a preference: 0.35 reports every process's CPU usage as
# exactly 0.0 on macOS, which is the whole of what the resource panel shows.
# The 0.36.0 changelog entry is "Linux/macOS: Fix CPU usage update", and the
# two versions were measured side by side on the same machine with the same
# refresh calls (0.35.2: 0%, 0.36.0: 100%) before this bound was moved.
sysinfo = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
libc = "0.2"
url = "2.5"
percent-encoding = "2.3"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
# The websocket CLIENT the integration tests connect with. Held at the version
# axum itself depends on, so a test speaks to the server through the same
# protocol implementation the server is running rather than a second, older one.
# Bump it whenever axum's does: `cargo tree -p tokio-tungstenite` names both.
tokio-tungstenite = "0.29"

[profile.release]
opt-level = "z"    # Optimize for size.
lto = true         # Enable link time optimization.
codegen-units = 1  # Reduce parallel code generation units.
# Line tables only (fork e79bfbe5, P2-4): file:line for panic locations and,
# where the platform keeps them, backtraces, at a ~1-2% size cost. The
# `strip` below still removes the symbol table from the shipped binary.
debug = "line-tables-only"
# Strip symbols here, in Cargo, so every release build is small by the same
# mechanism (CI has no separate strip step). The symbol-keeping path for
# profilers is [profile.profiling] below.
strip = "symbols"

[profile.profiling]
inherits = "release"
opt-level = 2     # Full speed optimizations (not size-optimized).
debug = 2         # Full debug info for symbols in flamegraphs.
strip = false     # Keep symbols intact for profilers.
lto = false       # Disable LTO so builds are faster during profiling.
