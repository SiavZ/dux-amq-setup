name: Deploy website

on:
  # Deploy when a new release of dux is published. This ties the live site to
  # actually-shipped versions: anything in `website/` only goes live alongside
  # a real release, so half-finished homepage edits never reach getdux.app on
  # their own.
  release:
    types: [published]

  # Break-glass: manually deploy whatever is on `main` right now. Useful when
  # the site needs a fix (typo, broken link, new screenshot) without cutting a
  # full app release.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy (defaults to the workflow ref)."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Don't cancel in-progress production
# deploys — let them finish to avoid leaving Pages in a half-published state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    # getdux.app (website/public/CNAME) is upstream's site and documents
    # upstream's install paths. This fork must not deploy it: a release here
    # would otherwise try to publish getdux.app content to the fork's Pages.
    # website-ci.yml still builds the site on PRs so upstream merges stay green.
    if: ${{ github.repository == 'patrickdappollonio/dux' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine checkout ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "Deploying release tag: $RELEASE_TAG"
          elif [ -n "$INPUT_REF" ]; then
            echo "value=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "Deploying user-supplied ref: $INPUT_REF"
          else
            echo "value=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "Deploying workflow ref: ${{ github.ref }}"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Verify install.sh is present at repo root
        run: |
          if [ ! -f install.sh ]; then
            echo "::error::install.sh missing at repo root; the website build expects it."
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          # Both projects: the site renders the web UI's real components, so its
          # dependencies are part of this build too.
          cache-dependency-path: |
            website/package-lock.json
            crates/dux-web/web/package-lock.json

      # No separate install for the dux web app here. `prep` installs it when it
      # is missing (see website/scripts/render-figure.mjs), so a local
      # `npm run dev`, a local `npm run build` and this workflow all take the
      # same path and cannot drift. The Node cache above covers both lockfiles.
      - name: Install dependencies
        working-directory: website
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        working-directory: website
        env:
          NODE_ENV: production
          # Enables analytics injection. Only set here, so local dev and local
          # or PR builds never load the tracking script.
          ENABLE_ANALYTICS: "true"
          # Lifts the GitHub API rate limit for build-time star counts on the
          # Recommended tools page. Falls back to unauthenticated if unset.
          GH_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Verify install.sh was copied into the build output
        run: |
          if [ ! -f website/dist/install.sh ]; then
            echo "::error::install.sh missing from build output; copy-install step failed."
            exit 1
          fi
          if [ ! -f website/dist/CNAME ]; then
            echo "::error::CNAME missing from build output."
            exit 1
          fi
          if [ ! -f website/dist/index.html ]; then
            echo "::error::index.html missing from build output."
            exit 1
          fi
          if [ ! -f website/dist/pagefind/pagefind.js ]; then
            echo "::error::pagefind search index missing from build output."
            exit 1
          fi

      - name: Verify search index (docs-only scope)
        working-directory: website
        run: npm run test:search

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
